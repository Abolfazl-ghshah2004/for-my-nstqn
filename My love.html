<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #ffe6ee;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        max-width: 350px;
        width: 90%;
    }

    img {
        width: 100%;
        border-radius: 15px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 22px;
        margin-bottom: 25px;
    }

    .buttons {
        position: relative;
        height: 80px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background: #ff4d6d;
        color: white;
        font-size: 18px;
    }

    #noBtn {
        background: #ccc;
        color: black;
        position: absolute;
        right: 0;
    }
</style>
</head>
<body>

<div class="container" id="main">
    <img src="https://i.postimg.cc/YSG4fDZn/photo23916777657.jpg" id="mainImage">
    <h1 id="text">Will you be my Valentine? 💕</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClicked()">YES</button>
        <button id="noBtn" onmouseover="moveNo()">NO</button>
    </div>
</div>

<script>
let yesSize = 18;

function moveNo() {
    const noBtn = document.getElementById("noBtn");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80 - 40;

    noBtn.style.transform = `translate(${x}px, ${y}px)`;

    yesSize += 6;
    document.getElementById("yesBtn").style.fontSize = yesSize + "px";
}

function yesClicked() {
    document.getElementById("main").innerHTML = `
        <img src="https://i.postimg.cc/1tVjSSTY/photo23917012887.jpg">
        <h1>I love you ❤️</h1>
    `;
}
</script>

</body>
</html>
